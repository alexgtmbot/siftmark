name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  macos:
    name: macOS build and test
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check Rust formatting, lint, and tests
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
      - name: Build and smoke-test the packaged app
        run: |
          ./build.sh
          ditto -x -k dist/Siftmark-local.zip "$RUNNER_TEMP/package"
          app="$RUNNER_TEMP/package/Siftmark.app"
          codesign --verify --deep --strict "$app"
          mkdir "$RUNNER_TEMP/sample"
          touch "$RUNNER_TEMP/sample/Empty.dmg" "$RUNNER_TEMP/sample/Other.txt"
          "$app/Contents/MacOS/siftmark-scan" "$RUNNER_TEMP/sample" installers > "$RUNNER_TEMP/result"
          printf '0\t0\tEmpty.dmg\0' | cmp - "$RUNNER_TEMP/result"
